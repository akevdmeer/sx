version: 2
project_name: sx

before:
  hooks:
    - go mod tidy
    # app/main.go embeds frontend/dist (go:embed all:); a fresh checkout
    # has no built frontend, so the embed target must exist or the app
    # package fails to compile. Mirrors the Makefile's ensure-app-embed.
    - mkdir -p app/frontend/dist
    - touch app/frontend/dist/.gitkeep
    - go test ./...

builds:
  - id: sx
    main: ./cmd/sx
    binary: sx
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/sleuth-io/sx/v2/internal/buildinfo.Version={{.Version}}
      - -X github.com/sleuth-io/sx/v2/internal/buildinfo.Commit={{.Commit}}
      - -X github.com/sleuth-io/sx/v2/internal/buildinfo.Date={{.Date}}

archives:
  - id: sx
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch

release:
  draft: false
  prerelease: auto
  name_template: "{{.ProjectName}} v{{.Version}}"

